<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File List</title>
    <style>
        /* 배경색을 헥스코드 #222272로 지정 */
        body {
            background-color: #222272;
            color: #ffffff;
            font-family: sans-serif;
            padding: 40px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 12px 0;
        }
        /* 링크 스타일 지정 */
        a {
            color: #4da6ff;
            text-decoration: none;
            font-size: 18px;
        }
        a:hover {
            text-decoration: underline;
            color: #80bfff;
        }
    </style>
</head>
<body>

    <ul>
        <li><a href="arnoldi022.jpg" target="_blank">📄 image1.png</a></li>
        <li><a href="ㄳ.png" target="_blank">📄 photo.jpg</a></li>
    </ul>

</body>
</html>
