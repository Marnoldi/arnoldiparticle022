<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File List</title>
    <style>
        /* 배경색을 헥스코드 #222272로 지정 */
        body {
            background-color: #222272;
            color: #ffffff;
            font-family: sans-serif;
            padding: 40px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }
        .image-container {
            margin-bottom: 30px;
        }
        .image-title {
            font-size: 18px;
            margin-bottom: 10px;
            display: block;
        }
        /* 이미지 크기가 화면을 벗어나지 않도록 설정 */
        img {
            max-width: 100%;
            height: auto;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            display: block;
        }
    </style>
</head>
<body>

    <h1>File List</h1>

    <div class="image-container">
        <span class="image-title">📄 image1.png</span>
        <img src="arnoldi022.jpg" alt="image1.png">
    </div>

    <div class="image-container">
        <span class="image-title">📄 photo.jpg</span>
        <img src="ㄳ.png" alt="photo.jpg">
    </div>

</body>
</html>
